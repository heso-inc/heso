name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Product surface guard
        run: cargo test -p heso-cli --test product_surface
      - name: Plat contract guard
        run: cargo test -p heso-engine-fetch plat::tests
      - name: Stateful RPC guard
        run: cargo test -p heso-cli --test serve_stateful_rpc
      # LEG 1 hero proof: K=16 fresh processes per cassette must reproduce
      # the pinned plat_hash byte-identically (single-host determinism).
      # The cross-arch matrix lives in determinism-matrix.yml.
      - name: Build heso-verify (ground-truth verifier)
        run: cargo build -p heso-verify --bin heso-verify
      - name: Determinism conformance guard
        run: cargo test -p heso-cli --test determinism_conformance
      - name: Cookie-order determinism guard
        run: cargo test -p heso-cli --test cookie_order_determinism
