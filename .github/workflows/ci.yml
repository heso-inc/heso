# GENERATED by heso-enterprise/scripts/sync-oss.sh — do not edit in the mirror.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - name: Test (default features — pure offline verify)
        run: cargo test --workspace
      - name: Test (tsa — RFC 3161 verification crypto)
        run: cargo test -p heso-action -p heso-verify-cli --features tsa
      - name: Verify-only surface guard
        run: |
          set -euo pipefail
          for f in src/sign.rs src/redact.rs src/taxonomy.rs src/export; do
            test ! -e "crates/heso-action/$f" || { echo "producer code leaked: $f"; exit 1; }
          done
          # comment/rustdoc lines may NAME producer APIs; only code lines fail
          ! { grep -RInE "ComplianceSigner|assemble_action_receipt|cosign_approval|LicenseRef-Proprietary" crates/ \
              | grep -vE '^[^:]+:[0-9]+:\s*(//|#)'; }
