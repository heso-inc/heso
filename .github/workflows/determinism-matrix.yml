name: Determinism Matrix

# Cross-architecture / cross-OS gate for LEG 1 (record / replay).
#
# The single-host K-process harness (tests/determinism_conformance.rs)
# proves byte-identical replay across HashMap RandomState + allocator
# entropy + process boundaries on ONE machine. It does NOT prove
# cross-arch byte-identity — that depends on rand_chacha (ChaCha20),
# serde_jcs ECMA-262 number formatting, BLAKE3, and the vendored
# QuickStop-NG (hesojs) fork all emitting identical bytes on
# aarch64-vs-x86_64 and macOS-vs-Linux.
#
# This workflow runs the SAME harness — asserting the SAME pinned
# per-cassette plat_hashes from the checked-in manifest — on four runners,
# EACH ON ITS OWN NATIVE TARGET (x86_64-linux on ubuntu-latest,
# aarch64-linux on ubuntu-24.04-arm, x86_64-darwin on macos-13,
# aarch64-darwin on macos-latest). This is a HOST build+test per runner,
# i.e. PER-NATIVE-TARGET reproduction across the four arch/OS combos — it
# is NOT cross-compilation, and it does not execute a foreign-arch binary.
# All cargo invocations are `--locked` so a Cargo.lock drift cannot
# silently change the produced bytes.
#
# Honesty: cross-arch byte-identity is an asserted design goal until this
# matrix is OBSERVED GREEN across all four targets. Once green, any
# divergence here is a RELEASE BLOCKER (the pinned bytes stopped being
# reproducible across the matrix), not a warning.
#
# See crates/heso-cli/tests/determinism_corpus/README.txt.

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/determinism-matrix.yml"
  push:
    branches: [main]

concurrency:
  group: determinism-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determinism:
    name: Determinism (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do NOT cancel siblings on first failure — we want to see WHICH
      # target(s) diverged, since a single-target divergence localizes the
      # portability bug (ChaCha20 / JCS number formatting / BLAKE3 / the
      # QuickJS fork on that arch).
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          # The runner IS this target, so no `--target` is passed to cargo:
          # we build+test NATIVELY (a foreign-arch cross-compile could not be
          # executed here anyway). The target name is declared for clarity
          # and for the per-target job name only.
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: determinism-${{ matrix.target }}
      # heso-verify is the verifier the harness cross-checks every replay
      # against (same serde_jcs as the engine — this catches a producer/
      # verifier WIRING split, not a JCS spec bug; that is closed by
      # heso-verify's rfc8785_conformance vectors). Build it up front so the
      # harness finds it beside `heso`. `--locked` pins the lockfile so a
      # Cargo.lock drift cannot silently change the produced bytes.
      - name: Build heso-verify
        run: cargo build --locked -p heso-verify --bin heso-verify
      # The gate: K=16 fresh processes per cassette must all reproduce the
      # SAME pinned plat_hash from the manifest, NATIVELY on THIS target. A
      # mismatch with a matching engine_id is a real cross-arch determinism
      # bug (one of the four native targets diverged from the pinned bytes).
      - name: Determinism conformance (K=16 fresh processes, native target)
        run: cargo test --locked -p heso-cli --test determinism_conformance -- --nocapture
      # The cookie-ordering regression (Hazard 1) must also hold per arch.
      - name: Cookie-order determinism regression
        run: cargo test --locked -p heso-cli --test cookie_order_determinism -- --nocapture
