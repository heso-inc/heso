name: Determinism Matrix

# Cross-architecture / cross-OS enforcement of LEG 1 (record / replay).
#
# The single-host K-process harness (tests/determinism_conformance.rs)
# proves byte-identical replay across HashMap RandomState + allocator
# entropy + process boundaries on ONE machine. It does NOT prove
# cross-arch byte-identity — that depends on rand_chacha (ChaCha20),
# serde_jcs ECMA-262 number formatting, BLAKE3, and the vendored
# QuickStop-NG (hesojs) fork all emitting identical bytes on
# aarch64-vs-x86_64 and macOS-vs-Linux.
#
# This workflow runs the SAME harness — asserting the SAME pinned
# per-cassette plat_hashes from the checked-in manifest — on all four
# release targets. ANY divergence here is a RELEASE BLOCKER, not a
# warning: it means the pinned bytes are not reproducible across the
# matrix, so the cross-arch determinism claim is not yet honest.
#
# See crates/heso-cli/tests/determinism_corpus/README.txt.

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/determinism-matrix.yml"
  push:
    branches: [main]

concurrency:
  group: determinism-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determinism:
    name: Determinism (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do NOT cancel siblings on first failure — we want to see WHICH
      # target(s) diverged, since a single-target divergence localizes the
      # portability bug (ChaCha20 / JCS number formatting / BLAKE3 / the
      # QuickJS fork on that arch).
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          targets: ${{ matrix.target }}
      # heso-verify is the dependency-free ground-truth verifier the
      # harness cross-checks every replay against. Build it up front so
      # the harness finds it beside `heso`.
      - name: Build heso-verify
        run: cargo build -p heso-verify --bin heso-verify
      # The gate: K=16 fresh processes per cassette must all reproduce the
      # SAME pinned plat_hash from the manifest, on THIS target. A mismatch
      # with a matching engine_id is a real cross-arch determinism bug.
      - name: Determinism conformance (K=16 fresh processes)
        run: cargo test -p heso-cli --test determinism_conformance -- --nocapture
      # The cookie-ordering regression (Hazard 1) must also hold per arch.
      - name: Cookie-order determinism regression
        run: cargo test -p heso-cli --test cookie_order_determinism -- --nocapture
