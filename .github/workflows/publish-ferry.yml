# TEMPORARY release ferry — publishes wheels built by heso-enterprise CI using
# this repo's PYPI_API_TOKEN (the registered PyPI deploy key lives HERE, a
# leftover of the pre-restructure pipeline). Dispatched once for 0.4.3, then
# removed. Long-term path: trusted publishing registered to heso-enterprise's
# packages.yml, after which no key exists anywhere.
name: publish-ferry

on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch holding wheels/ to publish
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: wheels/
